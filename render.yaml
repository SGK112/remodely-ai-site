services:
  # Static Website
  - type: web
    name: remodely-ai-site
    runtime: static
    buildCommand: echo "Static site ready"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: origin-when-cross-origin
      # NEVER cache HTML responses. Render uses Express-style globs where
      # `/*` only matches a single segment (so /, /tools/, /tools/foo all
      # missed). `/**` is the multi-segment catch-all that includes root.
      # Static assets below override via more-specific paths.
      - path: /**
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      # Versioned static assets are fingerprinted via ?v=N — safe to cache hard.
      - path: /css/**
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/**
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/**
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /tools/edge-visualizer/stones/**
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /careers
        destination: /careers.html
      - type: rewrite
        source: /business-plan
        destination: /business-plan.html
      - type: rewrite
        source: /launch-playbook
        destination: /launch-playbook.html
      - type: rewrite
        source: /tools/compare
        destination: /tools/compare/index.html
      - type: rewrite
        source: /tools/ai-probe
        destination: /tools/ai-probe/index.html
      - type: rewrite
        source: /tools/fix-it
        destination: /tools/fix-it/index.html
      - type: rewrite
        source: /tools/gbp
        destination: /tools/gbp/index.html
      - type: rewrite
        source: /tools/schema
        destination: /tools/schema/index.html
      - type: rewrite
        source: /tools/mobile
        destination: /tools/mobile/index.html
      - type: rewrite
        source: /tools/a11y
        destination: /tools/a11y/index.html
      - type: rewrite
        source: /tools/sitemap
        destination: /tools/sitemap/index.html
      - type: rewrite
        source: /tools/https
        destination: /tools/https/index.html
      - type: rewrite
        source: /tools/seo-checklist
        destination: /tools/seo-checklist/index.html
      - type: rewrite
        source: /tools/edge-visualizer
        destination: /tools/edge-visualizer/index.html
      - type: rewrite
        source: /tools
        destination: /tools/index.html

  # API Service with Aria Multi-tenant System
  - type: web
    name: remodely-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: remodely-db
          property: connectionString
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
    healthCheckPath: /api/health

databases:
  - name: remodely-db
    plan: free
    region: oregon
    databaseName: remodely
    user: remodely
