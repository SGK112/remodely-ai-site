<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" fill="none">
  <defs>
    <!-- ORANGE & WARM PALETTE ----------------------------------- -->
    <linearGradient id="house-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2517"/>
      <stop offset="100%" stop-color="#1f1812"/>
    </linearGradient>
    <linearGradient id="house-wall-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#221a13"/>
      <stop offset="100%" stop-color="#382820"/>
    </linearGradient>
    <linearGradient id="house-wall-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d2c1f"/>
      <stop offset="100%" stop-color="#221a13"/>
    </linearGradient>
    <linearGradient id="orange-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="floor-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="card-glow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" in="SourceAlpha"/>
      <feOffset dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="blueprint" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" stroke="#f97316" stroke-width="0.5" opacity="0.18" fill="none"/>
    </pattern>
  </defs>

  <!-- BLUEPRINT FLOOR PLANE (isometric grid) ------------------- -->
  <g transform="translate(300, 380)">
    <ellipse cx="0" cy="0" rx="280" ry="100" fill="url(#floor-glow)"/>
    <g stroke="rgba(249,115,22,0.22)" stroke-width="0.8" fill="none">
      <!-- Isometric grid lines -->
      <path d="M-260,-50 L260,80 M-260,-30 L260,100 M-260,-10 L260,120 M-260,10 L260,140 M-260,30 L260,160 M-260,50 L260,180"/>
      <path d="M-260,80 L260,-50 M-260,100 L260,-30 M-260,120 L260,-10 M-260,140 L260,10 M-260,160 L260,30 M-260,180 L260,50"/>
    </g>
    <!-- Corner markers -->
    <g fill="#f97316" opacity="0.5">
      <circle cx="-200" cy="0" r="2"/>
      <circle cx="200" cy="0" r="2"/>
      <circle cx="0" cy="-65" r="2"/>
      <circle cx="0" cy="65" r="2"/>
    </g>
  </g>

  <!-- HOUSE — isometric, simplified ---------------------------- -->
  <g transform="translate(300, 270)">
    <!-- Right wall (lighter) -->
    <path d="M0,0 L120,-60 L120,40 L0,100 Z" fill="url(#house-wall-r)" stroke="#4a3526" stroke-width="0.8"/>
    <!-- Left wall (darker) -->
    <path d="M0,0 L-120,-60 L-120,40 L0,100 Z" fill="url(#house-wall-l)" stroke="#4a3526" stroke-width="0.8"/>
    <!-- Roof (front-left peak) -->
    <path d="M0,-70 L-120,-60 L0,0 L120,-60 Z" fill="url(#house-roof)" stroke="#5a3d28" stroke-width="0.8"/>
    <!-- Front-left roof shadow line -->
    <path d="M0,-70 L0,0" stroke="#1a1209" stroke-width="0.8" opacity="0.7"/>

    <!-- Door (centered front, on right wall) -->
    <path d="M40,-20 L72,-36 L72,12 L40,28 Z" fill="#1a1108" stroke="#5a3d28" stroke-width="0.5"/>
    <circle cx="48" cy="0" r="1.2" fill="#fb923c"/>
    <!-- Window (left wall) -->
    <path d="M-90,-46 L-50,-66 L-50,-44 L-90,-24 Z" fill="#fb923c" opacity="0.18" stroke="#fb923c" stroke-width="0.5" stroke-opacity="0.4"/>
    <path d="M-70,-56 L-70,-34" stroke="#fb923c" stroke-width="0.4" stroke-opacity="0.4"/>
    <!-- Window (right wall) -->
    <path d="M88,-50 L108,-60 L108,-38 L88,-28 Z" fill="#fb923c" opacity="0.18" stroke="#fb923c" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Roof tile lines -->
    <g stroke="#5a3d28" stroke-width="0.4" opacity="0.4">
      <path d="M-100,-62 L-20,-22 M-80,-64 L0,-24 M-60,-66 L20,-26"/>
      <path d="M100,-62 L20,-22 M80,-64 L0,-24 M60,-66 L-20,-26"/>
    </g>
  </g>

  <!-- FLOATING PRODUCT CARDS — connected to the house ---------- -->

  <!-- 01: Phone / Aria call (top-left) -->
  <g transform="translate(80, 70)" filter="url(#shadow)">
    <ellipse cx="40" cy="-10" rx="60" ry="22" fill="url(#card-glow)"/>
    <rect x="0" y="0" width="80" height="100" rx="12" fill="#0f1525" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <rect x="0" y="0" width="80" height="100" rx="12" fill="url(#blueprint)"/>
    <!-- Phone body -->
    <rect x="22" y="14" width="36" height="72" rx="6" fill="#1e2a44" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
    <rect x="26" y="22" width="28" height="48" rx="2" fill="#0a0f1a"/>
    <!-- Aria avatar -->
    <circle cx="40" cy="36" r="6" fill="url(#orange-glow)"/>
    <text x="40" y="50" text-anchor="middle" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.85)" font-weight="600">Aria</text>
    <text x="40" y="58" text-anchor="middle" font-family="Inter, system-ui" font-size="3.5" fill="#22c55e">● online</text>
    <!-- Pulse rings -->
    <circle cx="40" cy="78" r="3" fill="none" stroke="#f97316" stroke-width="0.6" opacity="0.7"/>
    <circle cx="40" cy="78" r="6" fill="none" stroke="#f97316" stroke-width="0.4" opacity="0.4"/>
    <!-- Label -->
    <text x="40" y="113" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#fb923c" letter-spacing="0.5">[01] CALL</text>
  </g>

  <!-- 02: CRM card (top-right) -->
  <g transform="translate(420, 50)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="#0f1525" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#blueprint)"/>
    <!-- Header bar -->
    <rect x="8" y="8" width="104" height="14" rx="3" fill="rgba(249,115,22,0.15)"/>
    <text x="14" y="18" font-family="JetBrains Mono, monospace" font-size="6" fill="#fb923c" font-weight="600">NEW LEAD</text>
    <circle cx="106" cy="15" r="2" fill="#22c55e"/>
    <!-- Lead rows -->
    <text x="8" y="36" font-family="Inter, system-ui" font-size="6" fill="rgba(255,255,255,0.85)" font-weight="600">Sarah · Kitchen Remodel</text>
    <text x="8" y="46" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.55)">Phoenix, AZ · ~$28k budget</text>
    <line x1="8" y1="54" x2="112" y2="54" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="8" y="64" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.7)">Source: room-designer.html</text>
    <text x="8" y="73" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.7)">Status: <tspan fill="#fb923c">Aria contacted</tspan></text>
    <!-- Label -->
    <text x="60" y="93" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#fb923c" letter-spacing="0.5">[02] CRM</text>
  </g>

  <!-- 03: Calendar (right-mid) -->
  <g transform="translate(450, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="100" height="86" rx="10" fill="#0f1525" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <rect x="0" y="0" width="100" height="86" rx="10" fill="url(#blueprint)"/>
    <!-- Calendar header -->
    <rect x="0" y="0" width="100" height="14" rx="10" fill="rgba(249,115,22,0.18)"/>
    <text x="50" y="10" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#fb923c" font-weight="600">THU · APR 30</text>
    <!-- Time slots -->
    <g font-family="JetBrains Mono, monospace" font-size="4.5" fill="rgba(255,255,255,0.5)">
      <text x="6" y="26">9:00</text>
      <text x="6" y="36">10:00</text>
      <text x="6" y="46">11:00</text>
      <text x="6" y="56">12:00</text>
      <text x="6" y="66">1:00</text>
      <text x="6" y="76">2:00</text>
    </g>
    <!-- Booked appointment -->
    <rect x="22" y="32" width="74" height="14" rx="3" fill="url(#orange-glow)"/>
    <text x="26" y="42" font-family="Inter, system-ui" font-size="5" fill="#fff" font-weight="600">Sarah — Kitchen Estimate</text>
    <!-- Label -->
    <text x="50" y="99" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#fb923c" letter-spacing="0.5">[03] BOOKED</text>
  </g>

  <!-- 04: Invoice / payment (bottom-right) -->
  <g transform="translate(380, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="80" rx="8" fill="#0f1525" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <rect x="0" y="0" width="110" height="80" rx="8" fill="url(#blueprint)"/>
    <text x="8" y="14" font-family="JetBrains Mono, monospace" font-size="5" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">INVOICE #4282</text>
    <line x1="8" y1="20" x2="102" y2="20" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="8" y="33" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.7)">Kitchen — granite tops</text>
    <text x="102" y="33" text-anchor="end" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.85)">$8,400</text>
    <text x="8" y="44" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.7)">Install + edges</text>
    <text x="102" y="44" text-anchor="end" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.85)">$2,100</text>
    <line x1="8" y1="50" x2="102" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <text x="8" y="62" font-family="Inter, system-ui" font-size="6" fill="#fff" font-weight="700">Deposit (50%)</text>
    <text x="102" y="62" text-anchor="end" font-family="Inter, system-ui" font-size="7" fill="#fb923c" font-weight="700">$5,250</text>
    <!-- Paid stamp -->
    <g transform="translate(76, 68) rotate(-8)">
      <rect x="-12" y="-3" width="24" height="8" rx="1" fill="none" stroke="#22c55e" stroke-width="0.8"/>
      <text x="0" y="2.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="4.5" fill="#22c55e" font-weight="700">PAID</text>
    </g>
    <!-- Label -->
    <text x="55" y="93" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#fb923c" letter-spacing="0.5">[04] PAID</text>
  </g>

  <!-- 05: Toolbelt — calculators / designers (bottom-left) -->
  <g transform="translate(50, 350)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="76" rx="8" fill="#0f1525" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
    <rect x="0" y="0" width="120" height="76" rx="8" fill="url(#blueprint)"/>
    <text x="8" y="14" font-family="JetBrains Mono, monospace" font-size="5" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">LEAD-GEN TOOLS</text>
    <line x1="8" y1="20" x2="112" y2="20" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <!-- Tool 1: room designer (small icon) -->
    <g transform="translate(12, 28)">
      <rect width="24" height="20" rx="3" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.35)" stroke-width="0.5"/>
      <path d="M4,16 L12,4 L20,16 M8,16 L8,12 L16,12 L16,16" stroke="#fb923c" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    </g>
    <text x="40" y="40" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.85)">Room Designer</text>
    <!-- Tool 2: calculator -->
    <g transform="translate(12, 52)">
      <rect width="24" height="18" rx="3" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.35)" stroke-width="0.5"/>
      <line x1="6" y1="6" x2="18" y2="6" stroke="#fb923c" stroke-width="0.7"/>
      <line x1="6" y1="10" x2="18" y2="10" stroke="#fb923c" stroke-width="0.7"/>
      <line x1="6" y1="14" x2="14" y2="14" stroke="#fb923c" stroke-width="0.7"/>
    </g>
    <text x="40" y="64" font-family="Inter, system-ui" font-size="5" fill="rgba(255,255,255,0.85)">Takeoff Calc</text>
    <!-- Label -->
    <text x="60" y="89" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#fb923c" letter-spacing="0.5">[05] FREE TOOLS</text>
  </g>

  <!-- DOTTED CONNECTING LINES (data flow) ---------------------- -->
  <g stroke="rgba(249,115,22,0.45)" stroke-width="0.8" stroke-dasharray="3,3" fill="none">
    <!-- Phone (01) -> CRM (02) -->
    <path d="M160,90 Q280,40 420,80"/>
    <!-- CRM (02) -> Calendar (03) -->
    <path d="M540,110 Q560,160 510,210"/>
    <!-- Calendar (03) -> Invoice (04) -->
    <path d="M450,260 Q420,300 430,360"/>
    <!-- Tools (05) -> Phone (01) -->
    <path d="M110,350 Q70,200 110,150"/>
    <!-- Tools (05) -> CRM (02) -->
    <path d="M170,360 Q280,200 420,90"/>
  </g>

  <!-- Animated data dots traveling along paths -->
  <g fill="#fb923c">
    <circle r="2.5">
      <animateMotion dur="6s" repeatCount="indefinite" path="M160,90 Q280,40 420,80"/>
    </circle>
    <circle r="2.5">
      <animateMotion dur="6s" repeatCount="indefinite" path="M540,110 Q560,160 510,210"/>
    </circle>
    <circle r="2.5">
      <animateMotion dur="6s" repeatCount="indefinite" path="M450,260 Q420,300 430,360"/>
    </circle>
  </g>

  <!-- Label up top -->
  <g transform="translate(300, 32)">
    <text text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="rgba(249,115,22,0.85)" letter-spacing="2">YOUR BUSINESS, WIRED</text>
    <text y="13" text-anchor="middle" font-family="Inter, system-ui" font-size="8" fill="rgba(255,255,255,0.5)">tools → CRM → Aria → calendar → payment</text>
  </g>
</svg>
